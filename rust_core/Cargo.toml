[package]
name = "sbill_core"
version = "0.2.0"
edition = "2021"
description = "Offline-first shared travel ledger core engine (M1-M3)"

[lib]
name = "sbill_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
zeroize = "1"
base64 = "0.22"
blake3 = "1.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
flate2 = "1.0"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
